<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f3ec">
<title>Our Family Dashboard</title>
<style>
  :root {
    --ink: #293b32;
    --muted: #69776e;
    --paper: #f5f3ec;
    --card: #ffffff;
    --green: #e5eee4;
    --blue: #e6ecfa;
    --peach: #f8e7df;
    --purple: #eee5f7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont,
                 "Helvetica Neue", Arial, sans-serif;
    font-size: 17px;
  }
  main {
    max-width: 1100px;
    margin: auto;
    padding: 22px;
  }
  header, .section-title, .event {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  header { margin-bottom: 18px; }
  h1 { font-size: 32px; margin: 0 0 5px; }
  h2 { font-size: 21px; margin: 0 0 14px; }
  p { margin: 5px 0; }
  .muted { color: var(--muted); }
  .weather {
    background: #fcecc8;
    border-radius: 18px;
    padding: 14px 20px;
    min-width: 145px;
    text-align: center;
  }
  .temperature { font-size: 34px; font-weight: 700; }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .card {
    border-radius: 19px;
    padding: 20px;
    min-width: 0;
  }
  .agenda { background: var(--card); }
  .checklist { background: var(--blue); }
  .chores { background: var(--green); }
  .countdowns { background: var(--purple); }
  .calendar-actions { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin: 12px 0; }
  .calendar-actions button { font-size:14px; }
  .day-heading { font-weight:700; margin: 14px 0 3px; color:var(--ink); }
  .calendar-error { color:#a33333; }

  .item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid #00000012;
  }
  .item:last-child { border-bottom: 0; }
  input[type="checkbox"] {
    width: 25px;
    height: 25px;
    flex-shrink: 0;
    accent-color: #46785a;
  }
  .done { text-decoration: line-through; opacity: .6; }
  .event-time {
    background: #edf0e9;
    border-radius: 10px;
    padding: 9px;
    min-width: 75px;
    text-align: center;
    font-weight: 700;
  }
  .countdown-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 0;
    border-bottom: 1px solid #00000012;
  }
  .countdown-row:last-child { border-bottom: 0; }
  .countdown-picture {
    width: 76px;
    height: 76px;
    flex-shrink: 0;
    border-radius: 16px;
    background: #ffffffa8;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    line-height: 1;
  }
  .countdown-details { flex: 1; min-width: 0; }
  .countdown-name { display: block; font-size: 19px; }
  .countdown-days { font-size: 23px; font-weight: 750; margin-top: 5px; }
  @media (max-width: 600px) {
    .countdown-picture { width: 60px; height: 60px; font-size: 39px; }
    .countdown-days { font-size: 19px; }
  }
  button {
    border: 0;
    border-radius: 12px;
    background: #355b45;
    color: white;
    padding: 12px 16px;
    min-height: 44px;
    font-size: 16px;
    cursor: pointer;
  }
  .section-title { margin-bottom: 12px; }
  .small { font-size: 14px; }
  @media (max-width: 600px) {
    main { padding: 13px; }
    h1 { font-size: 26px; }
    .grid { gap: 9px; }
    .card { padding: 14px; }
    .weather { min-width: 115px; padding: 10px; }
  }

  .chores { grid-column: 1 / -1; }
  .forecast { background:#e7f0f5; margin-bottom:14px; padding:14px 18px; }
  .forecast h2 { margin:0 0 10px; font-size:19px; }
  .forecast-days { display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px; }
  .forecast-day { background:#ffffffb8;border-radius:12px;text-align:center;padding:10px 4px;min-width:0; }
  .forecast-day .forecast-icon { font-size:30px;line-height:1.3; }
  .forecast-day .forecast-temps { font-weight:700;font-size:16px;white-space:nowrap; }
  .forecast-day .forecast-low { color:var(--muted); }
  .forecast-day .forecast-rain { color:#286b93;font-size:13px; }
  @media(max-width:600px) { .forecast {padding:10px;} .forecast-days {gap:4px;} .forecast-day {padding:8px 2px;} .forecast-day .forecast-icon {font-size:23px;} .forecast-day .forecast-temps {font-size:13px;} .forecast-day .forecast-rain {font-size:11px;} }
  .kids-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr));gap:14px; }
  .kid-panel { background:rgba(255,255,255,.75);border-radius:18px;padding:14px; }
  .kid-panel.ollie { border-top:7px solid #8ac1ed; }
  .kid-panel.leo { border-top:7px solid #ffc88c; }
  .kid-heading { display:flex;align-items:center;justify-content:space-between;margin-bottom:10px; }
  .kid-heading h3 { margin:0;font-size:25px; }
  .task-grid { display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px; }
  .task-tile { background:white;border:2px solid transparent;border-radius:14px;min-height:166px;padding:9px 4px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;cursor:pointer;user-select:none; }
  .task-tile img { width:100%;max-width:86px;height:85px;object-fit:contain; }
  .task-tile span { font-size:13px;line-height:1.2;font-weight:650;min-height:32px; }
  .task-tile input { width:27px;height:27px;accent-color:#40825c; }
  .task-tile.completed { border-color:#6eae7b;background:#edf8ed; }
  .task-tile.completed span { text-decoration:line-through;opacity:.65; }
  .task-tile.disabled { opacity:.4;cursor:default; }
  .chores-foot { display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;flex-wrap:wrap; }
  @media(max-width:650px) { .kids-grid {grid-template-columns:1fr;} .task-tile {min-height:145px;} }
  @media(max-width:420px) { .task-grid {gap:4px;} .task-tile {padding:6px 2px;min-height:130px;} .task-tile img {height:60px;} .task-tile span {font-size:11px;} }

/* Compact landscape dashboard: forecast shares the header with date/time. */
html, body { min-height:100%; }
main { max-width:none; padding:12px 16px 6px; }
.topbar { display:grid; grid-template-columns:minmax(180px, 25%) minmax(0,1fr); gap:14px; align-items:center; margin-bottom:10px; }
.family-heading h1 { font-size:clamp(22px,2.8vw,34px);margin-bottom:3px; }
.family-heading p { margin:2px 0;font-size:clamp(13px,1.4vw,17px); }
.forecast { margin:0; padding:8px 10px; border-radius:15px; background:#e7f0f5; }
.forecast-label { font-weight:700;font-size:13px;margin-bottom:4px; }
.forecast-days { display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px; }
.forecast-day { padding:4px 2px; border-radius:9px; }
.forecast-day .forecast-icon { font-size:clamp(17px,2.4vw,25px);line-height:1.1; }
.forecast-day .forecast-temps { font-size:clamp(11px,1.3vw,14px); }
.forecast-day .forecast-rain { font-size:11px; }
.dashboard-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:minmax(0, 68fr) minmax(0, 32fr);gap:8px; }
.dashboard-grid > .card { min-height:0;overflow:auto;padding:11px 13px;border-radius:15px; }
.dashboard-grid h2 { font-size:clamp(16px,1.7vw,20px);margin:0 0 5px; }
.agenda { display:flex;flex-direction:column; }
#family-calendar { width:100%;flex:1;min-height:0;border:0;border-radius:9px;background:white; }
.kid-panel { padding:2px;background:transparent;border:0!important; }
.kid-heading { display:none; }
.kids-grid { display:block; }
.task-grid { gap:5px; }
.task-tile { min-height:0;padding:3px 2px;border-radius:10px; }
.task-tile img { height:clamp(28px,4.6vh,48px);max-width:60px; }
.task-tile span { font-size:clamp(10px,1.1vw,12px);min-height:26px; }
.task-tile input { width:21px;height:21px;margin:1px 0; }
.kid-card p { margin:2px 0 0;text-align:right;font-size:11px; }
.ollie-card { background:#e5f0fc; }
.leo-card { background:#f9ebdc; }
.countdown-row { padding:5px 0; }
.reset-button { display:block;margin:3px 0 0 auto;padding:4px 10px;min-height:26px;font-size:12px; }
@media (orientation:landscape) and (min-width:700px) {
  html,body { height:100%;overflow:hidden; }
  main { height:100dvh; height:100vh;display:flex;flex-direction:column; }
  .topbar { flex:0 0 auto; }
  .dashboard-grid { flex:1;min-height:0; }
}
@media (max-width:699px), (orientation:portrait) {
  .topbar { grid-template-columns:1fr; }
  .dashboard-grid { grid-template-columns:1fr;grid-template-rows:auto; }
  .dashboard-grid > .card { min-height:240px; }
  #family-calendar { min-height:300px; }
}

/* Pokémon-inspired, no-scroll landscape redesign */
:root {--ink:#102b47;--muted:#425a70;--paper:#d8f1f5;--green:#dcf3dc;--blue:#e0f3ff;--purple:#fff3ce;}
html,body {margin:0;width:100%;height:100%;overflow:hidden;}
body {background:linear-gradient(145deg,#83d6fc 0%,#d7f7ff 28%,#a2dfb0 72%,#4ca774 100%);}
body:before {content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;background:radial-gradient(circle at 8% 90%,#24773b 0 8%,transparent 9%),radial-gradient(circle at 92% 80%,#2b944f 0 12%,transparent 13%);}
main {position:relative;max-width:none;width:100%;height:100vh;height:100dvh;overflow:hidden;padding:clamp(5px,1vh,10px);display:flex;flex-direction:column;gap:clamp(4px,.8vh,8px);}
.topbar {display:grid;grid-template-columns:minmax(165px,29%) minmax(0,1fr);gap:8px;margin:0;min-height:0;flex:0 0 auto;max-height:24%;align-items:stretch;}
.family-heading {background:linear-gradient(100deg,#c6ecffdd,#e9faffdd);border:2px solid #2779b0;border-radius:13px;padding:5px 70px 5px 10px;position:relative;overflow:hidden;min-height:70px;}
.family-heading:after {content:"";position:absolute;right:0;bottom:0;width:clamp(55px,10vw,112px);height:100%;background:url('gengar.png') right bottom/contain no-repeat;}
.family-heading h1 {font-size:clamp(18px,2.5vw,32px);line-height:1.05;color:#f6cc26;-webkit-text-stroke:.65px #173e77;text-shadow:1px 2px #174f8b;margin:0 0 2px;white-space:nowrap;}
.family-heading p {font-size:clamp(11px,1.45vw,17px);line-height:1.1;margin:1px 0;}
.pokeball {color:#df4040;-webkit-text-stroke:1px #183b67;}
.forecast {padding:4px 8px;border:2px solid #2b80a6;border-radius:13px;background:#e2f5ffea;min-height:0;}
.forecast-label {font-size:clamp(10px,1.4vw,15px);margin:0 0 2px;line-height:1;}
#current-temp {font-size:clamp(16px,2.6vw,29px);color:#126b9e;}
.forecast-days {gap:3px;}
.forecast-day {padding:2px 1px;background:#fff9;border-radius:8px;}
.forecast-day .small {font-size:clamp(9px,1.15vw,13px)!important;line-height:1;}
.forecast-day .forecast-icon {font-size:clamp(14px,2.4vw,26px);line-height:1;}
.forecast-day .forecast-temps {font-size:clamp(9px,1.25vw,14px);line-height:1.1;}
.forecast-day .forecast-rain {font-size:clamp(9px,1.1vw,12px);line-height:1.1;}
.dashboard-grid {display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,64fr) minmax(0,36fr);gap:clamp(4px,.7vh,8px);flex:1;min-height:0;}
.dashboard-grid > .card {min-height:0;overflow:hidden;padding:clamp(5px,.8vh,10px);border:2px solid #2576a4;border-radius:13px;box-shadow:0 2px 4px #154b6433;}
.dashboard-grid h2 {font-size:clamp(14px,2vw,21px);margin:0 0 3px;line-height:1.1;}
.agenda {background:#e7f6ffed;display:flex;flex-direction:column;}
.countdowns {background:#fff4d8f2;}
#family-calendar {display:flex;flex-direction:column;min-height:0;flex:1;overflow:hidden;gap:2px;background:transparent;}
.calendar-event {display:flex;align-items:center;gap:7px;background:#fff9;border-radius:8px;padding:clamp(2px,.6vh,7px) 7px;min-height:0;flex:1;}
.calendar-event-icon {font-size:clamp(20px,3.1vh,34px);line-height:1;flex:0 0 38px;text-align:center;}
.calendar-event-detail {min-width:0;display:flex;align-items:center;gap:8px;flex:1;}
.calendar-event-detail strong {font-size:clamp(12px,1.55vw,18px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;}
.calendar-when {font-size:clamp(10px,1.15vw,14px);color:#365d78;white-space:nowrap;}
.countdown-row {padding:clamp(2px,.45vh,6px) 0;gap:6px;}
.countdown-picture {width:clamp(32px,5.2vh,55px)!important;height:clamp(32px,5.2vh,55px)!important;font-size:clamp(24px,4vh,40px)!important;}
.countdown-name {font-size:clamp(12px,1.7vw,18px)!important;}
.countdown-days {font-size:clamp(13px,1.8vw,20px)!important;margin-top:1px!important;}

.ollie-card {background:#d9f0ffed;}.leo-card {background:#ffe6c9ed;}

.task-tile span {font-size:clamp(9px,1.05vw,12px);line-height:1.08;min-height:0;}
.task-tile input {width:clamp(16px,2.5vh,23px);height:clamp(16px,2.5vh,23px);margin:0;}
.kid-card p {font-size:clamp(9px,1.1vw,12px);margin:1px 0;}
.reset-button {flex:0 0 auto;margin:0 0 0 auto;padding:2px 8px;min-height:22px;font-size:11px;}
@media (max-height:650px) and (orientation:landscape) {
 .topbar {max-height:21%;} .dashboard-grid {grid-template-rows:minmax(0,65fr) minmax(0,35fr);}
 .calendar-event:nth-child(n+6) {display:none;}
 .countdown-row:nth-child(n+5) {display:none;}
}
@media (orientation:portrait) {html,body{overflow:auto;}main{height:auto;min-height:100vh;overflow:visible}.topbar{grid-template-columns:1fr;max-height:none}.dashboard-grid{grid-template-columns:1fr;grid-template-rows:auto}.dashboard-grid>.card{min-height:170px}.task-tile img{height:45px}}

.weather-overlay[hidden]{display:none!important}
.weather-overlay{position:fixed;inset:0;z-index:1000;background:#092e52a8;display:flex;align-items:center;justify-content:center;padding:18px}
.weather-detail{position:relative;width:min(690px,96vw);max-height:88vh;overflow:auto;background:linear-gradient(145deg,#e3f7ff,#fff9df);border:4px solid #2387c0;border-radius:24px;box-shadow:0 14px 45px #001e43aa;padding:18px 20px;color:#12335a}

/* Calendar: compact, top-aligned agenda rows with date on the left. */
#family-calendar {justify-content:flex-start!important;align-content:start!important;gap:4px!important;}

/* Day-by-day calendar with touch navigation */
.calendar-header {display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.calendar-header h2 {margin:0}
.calendar-nav {display:flex;align-items:center;gap:5px}
.calendar-nav button {border:1px solid #b8d9ed;background:#f0faff;color:#183b5b;border-radius:10px;min-width:34px;height:32px;font-size:23px;font-weight:800;cursor:pointer;touch-action:manipulation}

.bonus-roll{font-size:clamp(10px,1.1vw,14px);font-weight:800;background:#e4d3ff;border:1px solid #a68ad3;border-radius:10px;padding:7px 8px;color:#402875;white-space:nowrap;cursor:pointer}

function getSaved(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (_) {
    return fallback;
  }
}

function save(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch (_) {}
}

function localDayKey() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
let choreCelebrationTimeout;
function celebrateChore(kidName){
  const layer=document.getElementById("chore-celebration");
  const gif=document.getElementById("chore-celebration-gif");
  document.getElementById("chore-celebration-title").textContent="Great job, "+kidName+"!";
  // Reload GIF so its animation starts at the first frame every time.
  const isLeo = kidName.toLowerCase().includes("léo") || kidName.toLowerCase().includes("leo");
  gif.src=(isLeo ? "gyarados_good_job.gif" : "gengar_good_job.gif")+"?play="+Date.now();
  gif.alt=isLeo ? "Gyarados celebrating Léo's success" : "Gengar celebrating Ollie's success";
  layer.hidden=false;
  clearTimeout(choreCelebrationTimeout);
  choreCelebrationTimeout=setTimeout(function(){layer.hidden=true;},2200);
}
function choresStorageKey() { return "family-chores-v2-" + localDayKey(); }
function isWeekday() { const day = new Date().getDay(); return day >= 1 && day <= 5; }
function renderKidsChores() {
  const state = getSaved(choresStorageKey(), {});
  let total = 0, done = 0;
  [{id:"ollie",name:"Ollie",cls:"ollie"},{id:"leo",name:"Léo",cls:"leo"}].forEach(kid => {
    const root = document.getElementById(kid.id + "-chores");
    root.innerHTML = "";
    const panel = document.createElement("section");
    panel.className = "kid-panel " + kid.cls;
    const heading = document.createElement("div"); heading.className = "kid-heading";
    const name = document.createElement("h3"); name.textContent = kid.name;
    const score = document.createElement("strong");
    heading.append(name,score);panel.appendChild(heading);
    const grid = document.createElement("div"); grid.className = "task-grid";
    let kidTotal=0,kidDone=0;
    choreTasks.forEach(task => {
      const enabled = !task.weekdaysOnly || isWeekday();
      const key = kid.id + ":" + task.id;
      const checked = !!state[key] && enabled;
      const tile = document.createElement("label");
      tile.className = "task-tile" + (checked ? " completed" : "") + (!enabled ? " disabled" : "");
      const pic = document.createElement("img");pic.src = task.image;pic.alt = task.title;
      const label = document.createElement("span");label.textContent = task.title;
      const check = document.createElement("input");check.type="checkbox";check.checked=checked;check.disabled=!enabled;
      check.setAttribute("aria-label",kid.name+": "+task.title);
      check.addEventListener("change",()=>{
        const updated=getSaved(choresStorageKey(),{});updated[key]=check.checked;
        save(choresStorageKey(),updated);renderKidsChores();
        if(check.checked)celebrateChore(kid.name);
      });
      tile.append(pic,label,check);grid.appendChild(tile);
      if(enabled){total++;kidTotal++;if(checked){done++;kidDone++;}}
    });
    score.textContent=kidDone+" / "+kidTotal+" done";
    panel.appendChild(grid);root.appendChild(panel);
    document.getElementById(kid.id + "-progress").textContent = kidDone + " of " + kidTotal + " done";
  });

}
function resetTodaysChores() { save(choresStorageKey(),{});renderKidsChores(); }

function renderCountdowns() {
  const container = document.getElementById("countdown-list");
  container.innerHTML = "";
  const now = new Date();
  const today = Date.UTC(
    now.getFullYear(), now.getMonth(), now.getDate()
  );

  const upcoming = specialDates.map(item => {
    const parts = item.date.split("-").map(Number);
    // Repeat annually, and always use the next upcoming occurrence.
    let target = Date.UTC(now.getFullYear(), parts[1] - 1, parts[2]);
    if (target < today) {
      target = Date.UTC(now.getFullYear() + 1, parts[1] - 1, parts[2]);
    }
    return { item, days: Math.round((target - today) / 86400000) };
  }).filter(event => event.days <= 90)
    .sort((a, b) => a.days - b.days || a.item.title.localeCompare(b.item.title));

  if (upcoming.length === 0) {
    const empty = document.createElement("p");
    empty.className = "muted";
    empty.textContent = "Nothing coming up in the next 90 days 🎉";
    container.appendChild(empty);
  }

  upcoming.forEach(({ item, days }) => {

    const row = document.createElement("div");
    row.className = "countdown-row";
    const picture = document.createElement("div");
    picture.className = "countdown-picture";
    picture.setAttribute("role", "img");
    picture.setAttribute("aria-label", item.title);
    if (item.image) {
      const img = document.createElement("img");
      img.src = item.image;
      img.alt = "";
      img.style.cssText = "width:100%;height:100%;object-fit:contain;border-radius:16px";
      img.onerror = () => { picture.textContent = item.picture || "🎉"; };
      picture.appendChild(img);
    } else {
      picture.textContent = item.picture || "🎉";
    }
    const details = document.createElement("div");
    details.className = "countdown-details";
    const name = document.createElement("strong");
    name.className = "countdown-name";
    name.textContent = item.title;
    const remaining = document.createElement("div");
    remaining.className = "countdown-days";
    remaining.textContent = days === 0
      ? "Today! 🎉"
      : days + (days === 1 ? " day to go" : " days to go");

    const dateLabel=document.createElement("div");dateLabel.className="countdown-date";
    const p=item.date.split("-").map(Number);
    dateLabel.textContent=new Date(2026,p[1]-1,p[2]).toLocaleDateString("en-CA",{month:"long",day:"numeric"});
    details.append(name,dateLabel);
    const daysBadge=document.createElement("div");daysBadge.className="days-badge";daysBadge.appendChild(remaining);
    row.append(picture, details, daysBadge);
    container.appendChild(row);
  });
}

function updateClock() {
  const now = new Date();
  document.getElementById("today").textContent =
    now.toLocaleDateString(undefined, {
      weekday: "long", month: "long", day: "numeric"
    });
  document.getElementById("clock").textContent =
    now.toLocaleTimeString(undefined, {
      hour: "numeric", minute: "2-digit"
    });
}

let detailedWeather = null;
async function loadWeather() {
  // Calgary example coordinates. Change these to your location.
  const latitude = 51.0447;
  const longitude = -114.0719;

  try {
    const url = "https://api.open-meteo.com/v1/forecast"
      + "?latitude=" + latitude
      + "&longitude=" + longitude
      + "&current=temperature_2m,weather_code"
      + "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset,precipitation_sum"
      + "&hourly=temperature_2m,precipitation_probability,weather_code,wind_speed_10m"
      + "&timezone=America%2FEdmonton&forecast_days=5";

    const response = await fetch(url);
    if (!response.ok) throw new Error("Weather unavailable");
    const data = await response.json();

    detailedWeather = data;
    renderForecast(data.daily);
    document.getElementById("current-temp").textContent = Math.round(data.current.temperature_2m) + "°";
  } catch (_) {
    document.getElementById("forecast-days").textContent =
      "Forecast unavailable — check your internet connection.";
  }
}

function renderForecast(daily) {
  const root = document.getElementById("forecast-days");
  root.innerHTML = "";
  if (!daily || !daily.time || !daily.time.length) {
    root.textContent = "Forecast unavailable";
    return;
  }
  daily.time.slice(0, 5).forEach((dateString, i) => {
    const day = document.createElement("button");
    day.type = "button";
    day.className = "forecast-day";
    day.setAttribute("aria-label", "Detailed forecast for " + dateString);
    day.addEventListener("click", function(){ openWeatherDetail(i); });
    const name = document.createElement("div");
    name.className = "small";
    name.style.fontWeight = "700";
    // Noon avoids date rollover from UTC offsets on older iPads.
    name.textContent = i === 0 ? "Today" :
      new Date(dateString + "T12:00:00").toLocaleDateString("en-CA", { weekday:"short" });
    const icon = document.createElement("div");
    icon.className = "forecast-icon";
    icon.textContent = weatherEmoji(daily.weather_code[i]);
    const temps = document.createElement("div");
    temps.className = "forecast-temps";
    temps.textContent = Math.round(daily.temperature_2m_max[i]) + "° / " +
      Math.round(daily.temperature_2m_min[i]) + "°";
    const rain = document.createElement("div");
    rain.className = "forecast-rain";
    const chance = daily.precipitation_probability_max && daily.precipitation_probability_max[i];
    rain.textContent = Number.isFinite(chance) ? "💧 " + Math.round(chance) + "%" : " ";
    day.appendChild(name); day.appendChild(icon); day.appendChild(temps); day.appendChild(rain);
    root.appendChild(day);
  });
}


function openWeatherDetail(i) {
  if (!detailedWeather || !detailedWeather.daily) return;
  const d = detailedWeather.daily;
  const date = d.time[i];
  const readable = new Date(date + "T12:00:00").toLocaleDateString("en-CA", {weekday:"long",month:"long",day:"numeric"});
  document.getElementById("detail-title").textContent = weatherEmoji(d.weather_code[i]) + " " + readable;
  const content = document.getElementById("detail-content");
  content.textContent = "";
  const summary = document.createElement("div");
  summary.className = "weather-summary";
  summary.textContent = weatherDescription(d.weather_code[i]);
  content.appendChild(summary);
  const stats = document.createElement("div"); stats.className = "weather-stats";
  const chance = d.precipitation_probability_max && d.precipitation_probability_max[i];
  const sunrise = d.sunrise && d.sunrise[i] ? d.sunrise[i].slice(11,16) : "—";
  const sunset = d.sunset && d.sunset[i] ? d.sunset[i].slice(11,16) : "—";
  const values = [
    ["🌡️ High / Low", Math.round(d.temperature_2m_max[i]) + "° / " + Math.round(d.temperature_2m_min[i]) + "°"],
    ["💧 Precipitation chance", Number.isFinite(chance) ? Math.round(chance) + "%" : "—"],
    ["🌧️ Total precipitation", Number.isFinite(d.precipitation_sum[i]) ? d.precipitation_sum[i].toFixed(1) + " mm" : "—"],
    ["🌅 Sunrise", sunrise], ["🌇 Sunset", sunset]
  ];
  values.forEach(function(pair){
    const el=document.createElement("div"); el.className="weather-stat";
    const label=document.createElement("div");label.textContent=pair[0];
    const val=document.createElement("strong");val.textContent=pair[1];
    el.appendChild(label);el.appendChild(val);stats.appendChild(el);
  });
  content.appendChild(stats);
  const h=detailedWeather.hourly;
  const points=[];
  if(h && h.time && h.temperature_2m){
    h.time.forEach(function(t,j){
      if(t.slice(0,10)===date && Number.isFinite(h.temperature_2m[j])){
        points.push({hour:Number(t.slice(11,13)),temp:h.temperature_2m[j],
          code:h.weather_code?h.weather_code[j]:0});
      }
    });
  }
  if(points.length>1){
    const ns="http://www.w3.org/2000/svg";
    const W=740,H=320,L=32,R=66,T=55,B=43;
    const min=Math.floor((Math.min.apply(null,points.map(p=>p.temp))-3)/3)*3;
    const max=Math.ceil((Math.max.apply(null,points.map(p=>p.temp))+3)/3)*3;
    const x=hour=>L+hour/23*(W-L-R);
    const y=temp=>T+(max-temp)/(max-min)*(H-T-B);
    const svg=document.createElementNS(ns,"svg");
    svg.setAttribute("viewBox","0 0 "+W+" "+H);
    svg.setAttribute("role","img");
    svg.setAttribute("aria-label","Hourly temperature chart for "+readable);
    svg.classList.add("temperature-chart");
    function el(tag,attrs,text,parent){
      const node=document.createElementNS(ns,tag);
      Object.keys(attrs).forEach(k=>node.setAttribute(k,attrs[k]));
      if(text!==undefined)node.textContent=text;
      (parent||svg).appendChild(node);
      return node;
    }
    const defs=el("defs",{});
    const grad=el("linearGradient",{id:"weather-fill",x1:"0",y1:"0",x2:"0",y2:"1"},undefined,defs);
    el("stop",{offset:"0%","stop-color":"#48b9ee","stop-opacity":"0.47"},undefined,grad);
    el("stop",{offset:"100%","stop-color":"#173c67","stop-opacity":"0.36"},undefined,grad);
    for(let k=0;k<=5;k++){
      const temp=min+(max-min)*k/5,yy=y(temp);
      el("line",{x1:L,y1:yy,x2:W-R+4,y2:yy,stroke:"#454b52","stroke-width":"1"});
      el("text",{x:W-R+18,y:yy+6,fill:"#c2c5cc","font-size":"18"},Math.round(temp)+"°");
    }
    [0,6,12,18,23].forEach(hour=>{
      el("line",{x1:x(hour),y1:T,x2:x(hour),y2:H-B+5,stroke:"#393d43","stroke-width":"1","stroke-dasharray":"4 5"});
      el("text",{x:x(hour),y:H-13,"text-anchor":hour===0?"start":hour===23?"end":"middle",fill:"#a5a7ac","font-size":"17"},
        hour===0?"12AM":hour===12?"12PM":hour<12?hour+"AM":(hour-12)+"PM");
    });
    const dline=points.map((p,i)=>(i?"L":"M")+x(p.hour).toFixed(1)+","+y(p.temp).toFixed(1)).join(" ");
    const area=dline+" L"+x(points[points.length-1].hour)+","+(H-B)+" L"+x(points[0].hour)+","+(H-B)+" Z";
    el("path",{d:area,fill:"url(#weather-fill)"});
    el("path",{d:dline,fill:"none",stroke:"#48b8e9","stroke-width":"5","stroke-linecap":"round","stroke-linejoin":"round"});
    const lo=points.reduce((a,b)=>b.temp<a.temp?b:a);
    const hi=points.reduce((a,b)=>b.temp>a.temp?b:a);
    [lo,hi].forEach((p,i)=>{
      el("circle",{cx:x(p.hour),cy:y(p.temp),r:"8",fill:"#1b2025",stroke:"#62d1ff","stroke-width":"4"});
      el("text",{x:x(p.hour),y:y(p.temp)-17,"text-anchor":"middle",fill:"#f2f5f9","font-size":"18","font-weight":"bold"},
        (i?"H ":"L ")+Math.round(p.temp)+"°");
    });
    [0,3,6,9,12,15,18,21,23].forEach(hour=>{
      const p=points.find(q=>q.hour===hour);
      if(p)el("text",{x:x(hour),y:32,"text-anchor":"middle","font-size":"24",fill:"#e0e5ed"},weatherEmoji(p.code));
    });
    content.appendChild(svg);
  }else{
    const msg=document.createElement("p");
    msg.textContent="Hourly temperatures are unavailable for this day.";
    content.appendChild(msg);
  }
  document.getElementById("weather-overlay").hidden=false;
  document.getElementById("weather-close").focus();
}
function closeWeatherDetail(){document.getElementById("weather-overlay").hidden=true;}
document.getElementById("weather-close").addEventListener("click",closeWeatherDetail);
document.getElementById("weather-overlay").addEventListener("click",function(e){if(e.target===this)closeWeatherDetail();});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeWeatherDetail();});

function weatherDescription(code) {
  if (code === 0) return "Clear sky";
  if ([1, 2].includes(code)) return "Partly cloudy";
  if (code === 3) return "Overcast";
  if ([45, 48].includes(code)) return "Foggy";
  if ([51, 53, 55, 56, 57].includes(code)) return "Drizzle";
  if ([61, 63, 65, 66, 67, 80, 81, 82].includes(code))
    return "Rain";
  if ([71, 73, 75, 77, 85, 86].includes(code)) return "Snow";
  if ([95, 96, 99].includes(code)) return "Thunderstorms";
  return "Current conditions";
}

function weatherEmoji(code) {
  if (code === 0) return "☀️";
  if ([1, 2, 3].includes(code)) return "🌤️";
  if ([45, 48].includes(code)) return "🌫️";
  if ([71, 73, 75, 77, 85, 86].includes(code)) return "❄️";
  if ([95, 96, 99].includes(code)) return "⛈️";
  if ([51, 53, 55, 56, 57, 61, 63, 65, 66, 67, 80, 81, 82]
      .includes(code)) return "🌧️";
  return "🌥️";
}

function renderAll() {
  renderKidsChores();
  renderCountdowns();
  updateClock();
}


// Events are synchronized from the public Google Calendar by GitHub Actions.
// This avoids Google's iframe cookie banner on older iPads.
function eventPicture(title) {
  const t = title.toLowerCase();
  if (/birthday|party|anniversaire/.test(t)) return "🎂";
  if (/school|class|teacher|école/.test(t)) return "🚌";
  if (/hockey/.test(t)) return "🏒";
  if (/soccer|football/.test(t)) return "⚽";
  if (/swim|pool/.test(t)) return "🏊";
  if (/squash|tennis/.test(t)) return "🎾";
  if (/dentist|doctor|appointment/.test(t)) return "🩺";
  if (/trip|flight|vacation|travel/.test(t)) return "✈️";
  if (/camp/.test(t)) return "🏕️";
  if (/dinner|restaurant|lunch/.test(t)) return "🍽️";
  if (/christmas/.test(t)) return "🎄";
  if (/halloween/.test(t)) return "🎃";
  return "⭐";
}
const calendarTZ = "America/Edmonton";
let calendarDayOffset = 0;
let savedCalendarEvents = [];

function calDayKey(date) {
  const parts = new Intl.DateTimeFormat("en-US", {
    year:"numeric",month:"2-digit",day:"2-digit",timeZone:calendarTZ
  }).formatToParts(date);
  const value = type => parts.find(p=>p.type===type).value;
  return value("year")+"-"+value("month")+"-"+value("day");
}
function calSelectedDate() {
  // Noon UTC avoids DST-related midnight changes in Calgary.
  const todayParts = new Intl.DateTimeFormat("en-US", {
    year:"numeric",month:"numeric",day:"numeric",timeZone:calendarTZ
  }).formatToParts(new Date());
  const part = name => Number(todayParts.find(p => p.type === name).value);
  const d = new Date(Date.UTC(part("year"),part("month")-1,part("day"),12));
  d.setUTCDate(d.getUTCDate()+calendarDayOffset);
  return d;
}
function calKeyForSelected() {
  const d = calSelectedDate();
  return [d.getUTCFullYear(),String(d.getUTCMonth()+1).padStart(2,"0"),String(d.getUTCDate()).padStart(2,"0")].join("-");
}
function renderCalendarEvents(events) {
  savedCalendarEvents = events;
  const root = document.getElementById("family-calendar");
  root.innerHTML = "";
  const selected = calSelectedDate();
  const selectedKey = calKeyForSelected();
  const label = calendarDayOffset === 0 ? "Today" :
    selected.toLocaleDateString("en-CA",{weekday:"short",month:"short",day:"numeric",timeZone:"UTC"});
  document.getElementById("calendar-selected-day").textContent = label;

  const dayEvents = events.filter(e => {
    if (!e.start) return false;
    const first = calDayKey(new Date(e.start));
    const last = e.end ? calDayKey(new Date(new Date(e.end).getTime()-1)) : first;
    return first <= selectedKey && last >= selectedKey;
  }).sort((a,b) => new Date(a.start)-new Date(b.start));

  if (!dayEvents.length) {
    const msg = document.createElement("p");
    msg.className = "calendar-empty";
    msg.textContent = "No events for this day ✨  Swipe left for the next day.";
    root.appendChild(msg);
    return;
  }
  dayEvents.slice(0,7).forEach(e => {
    const row = document.createElement("div"); row.className = "calendar-event";
    const icon = document.createElement("span"); icon.className="calendar-event-icon"; icon.textContent=eventPicture(e.title || "Event");
    const detail=document.createElement("div"); detail.className="calendar-event-detail";
    const name=document.createElement("strong"); name.textContent=e.title || "Untitled event";
    const when=document.createElement("span"); when.className="calendar-when";
    const start=new Date(e.start);
    const time=e.all_day ? "All day" : start.toLocaleTimeString("en-CA",{hour:"numeric",minute:"2-digit",timeZone:calendarTZ});
    const timeLabel=document.createElement("span"); timeLabel.className="event-time"; timeLabel.textContent=time;
    when.appendChild(timeLabel);
    detail.appendChild(name);detail.appendChild(when);
    row.appendChild(icon);row.appendChild(detail);root.appendChild(row);
  });
}
function changeCalendarDay(delta) {
  calendarDayOffset += delta;
  renderCalendarEvents(savedCalendarEvents);
}
document.getElementById("calendar-prev").addEventListener("click",()=>changeCalendarDay(-1));
document.getElementById("calendar-next").addEventListener("click",()=>changeCalendarDay(1));
document.getElementById("calendar-today").addEventListener("click",()=>{
  calendarDayOffset=0;renderCalendarEvents(savedCalendarEvents);
});
const calendarSwipeArea = document.querySelector(".agenda");
let swipeStartX=0, swipeStartY=0;
calendarSwipeArea.addEventListener("touchstart", e => {
  if(e.touches.length!==1)return;
  swipeStartX=e.touches[0].clientX;
  swipeStartY=e.touches[0].clientY;
},{passive:true});
calendarSwipeArea.addEventListener("touchend", e => {
  if(!e.changedTouches.length)return;
  const dx=e.changedTouches[0].clientX-swipeStartX;
  const dy=e.changedTouches[0].clientY-swipeStartY;
  if(Math.abs(dx)>45 && Math.abs(dx)>Math.abs(dy)*1.4) changeCalendarDay(dx<0?1:-1);
},{passive:true});
async function loadCalendar() {
  try {
    const response=await fetch("calendar-events.json?refresh="+Math.floor(Date.now()/300000),{cache:"no-store"});
    if(!response.ok) throw new Error("Not synchronized yet");
    const data=await response.json();renderCalendarEvents(data.events || []);
  } catch(e) {
    document.getElementById("family-calendar").textContent="Calendar setup needed — enable the included GitHub Action.";
  }
}
renderAll();
loadWeather();
loadCalendar();
setInterval(loadCalendar, 5 * 60 * 1000);
setInterval(updateClock, 30000);
setInterval(loadWeather, 30 * 60 * 1000);
// A midnight refresh keeps the displayed date range current.
setInterval(function() { renderCountdowns(); renderKidsChores(); renderCalendarEvents(savedCalendarEvents); }, 60 * 1000);

const bonusMissionPool = [
  "🧸 Put away 10 toys",
  "📚 Read for 10 minutes",
  "🧦 Match 5 pairs of socks",
  "🧹 Sweep a small area",
  "🧥 Hang up your jacket",

  "💌 Make a thank-you card",

  "📖 Tidy your bookshelf",
  "🛏️ Tidy your bedroom floor"
];
function bonusKey(kid){return "family-bonus-v1-"+localDayKey()+"-"+kid;}
function showBonus(kid){
  const state=getSaved(bonusKey(kid),{});
  document.getElementById(kid+"-bonus-task").textContent=state.task || "Tap Surprise Me!";
  document.getElementById(kid+"-bonus-done").checked=!!state.done;
  document.getElementById(kid+"-bonus-done").disabled=!state.task;
  document.getElementById(kid+"-bonus-task").parentNode.classList.toggle("is-done",!!state.done);
}
function rollBonus(kid){
  const state=getSaved(bonusKey(kid),{});
  const available=bonusMissionPool.filter(function(task){return task!==state.task;});
  const task=available[Math.floor(Math.random()*available.length)];
  save(bonusKey(kid),{task:task,done:false});
  showBonus(kid);
}
["ollie","leo"].forEach(function(kid){
  document.getElementById(kid+"-bonus-roll").addEventListener("click",function(){rollBonus(kid);});
  document.getElementById(kid+"-bonus-done").addEventListener("change",function(){
    const state=getSaved(bonusKey(kid),{});
    if(!state.task)return;
    state.done=this.checked;
    save(bonusKey(kid),state);
    showBonus(kid);
    if(state.done)celebrateChore(kid==="leo"?"Léo":"Ollie");
  });
  showBonus(kid);
});
</script>


<script id="brownie-points-script">
(function(){
var key="family-dashboard-brownie-points-v1";
var points={leo:0,ollie:0};
try{var stored=JSON.parse(localStorage.getItem(key)||"{}");["leo","ollie"].forEach(function(k){if(Number.isSafeInteger(stored[k])&&stored[k]>=0)points[k]=stored[k];});}catch(e){}
function render(){["leo","ollie"].forEach(function(k){document.getElementById("brownie-"+k).textContent=points[k];var minus=document.querySelector('[data-brownie="'+k+'"][data-change="-1"]');if(minus)minus.disabled=points[k]===0;});}
document.querySelectorAll("[data-brownie][data-change]").forEach(function(button){button.addEventListener("click",function(){var k=this.getAttribute("data-brownie");var d=Number(this.getAttribute("data-change"));points[k]=Math.max(0,points[k]+d);try{localStorage.setItem(key,JSON.stringify(points));}catch(e){}render();});});
window.addEventListener("storage",function(e){if(e.key===key){try{var next=JSON.parse(e.newValue||"{}");["leo","ollie"].forEach(function(k){if(Number.isSafeInteger(next[k])&&next[k]>=0)points[k]=next[k];});render();}catch(err){}}});
render();
})();
